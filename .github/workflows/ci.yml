name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run check

      # ADR-0005's Toolkit rules: no inline svg, hex, stray @keyframes or
      # arbitrary sizes in our Components and layouts. Prints file and line.
      - run: npm run check:toolkit

      - run: npx playwright install --with-deps chromium

      # Builds the site, serves dist/, then runs the smoke, axe and URL parity tests.
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  preview-parity:
    name: URL parity on Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Cloudflare deploys the Preview through its Git integration and reports
      # it only as the "Cloudflare Pages" check run. Its summary holds the
      # Preview URL for this exact commit.
      - name: Wait for the Cloudflare Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deadline=$((SECONDS + 1200))
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=Cloudflare%20Pages" --jq '.check_runs[0] // {}')
            status=$(jq -r '.status // "not started"' <<<"$run")
            if [ "$status" = completed ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              [ "$conclusion" = success ] || { echo "::error::Cloudflare Pages deploy concluded $conclusion"; exit 1; }
              url=$(jq -r .output.summary <<<"$run" | grep -oE 'https://[0-9a-f]{8}\.chesamel\.pages\.dev' | head -1)
              [ -n "$url" ] || { echo "::error::No Preview URL in the Cloudflare Pages check"; exit 1; }
              echo "Preview: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Timed out waiting for Cloudflare Pages"; exit 1; }
            echo "Cloudflare Pages: $status"
            sleep 15
          done

      # Also checks the Preview sends noindex, so it never reaches search (#54).
      - name: Check URL parity against the Preview
        run: npx playwright test tests/url-parity/site.spec.ts tests/url-parity/preview-noindex.spec.ts
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-parity-report
          path: playwright-report/
          retention-days: 14
